spring.application.name=DentalBot
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically creates/updates database tables based on JPA entities
#Create and Drop for development, update for production.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable automatic Docker compose execution (Docker runs inside WSL)
spring.docker.compose.enabled=false

# WhatsApp Cloud API Settings
whatsapp.api-url=https://graph.facebook.com/v21.0
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.doctor.phone-number=${DOCTOR_WHATSAPP_PHONE}

# Meta App Secret used to validate X-Hub-Signature-256 on incoming POSTs.
whatsapp.app-secret=${WHATSAPP_APP_SECRET}

# Fail closed by default. Set to false only for local development without a Meta app secret.
whatsapp.signature-verification-enabled=${WHATSAPP_SIGNATURE_VERIFICATION_ENABLED}

# Appointment reminders
app.reminders.enabled=${REMINDER_ENABLED}
app.reminders.zone=${REMINDER_ZONE}
app.reminders.send-time=${REMINDER_SEND_TIME}
app.reminders.batch-size=${REMINDER_BATCH_SIZE}
app.reminders.max-attempts=${REMINDER_MAX_ATTEMPTS}
app.reminders.claim-timeout-minutes=${REMINDER_CLAIM_TIMEOUT_MINUTES}
app.reminders.poll-interval-ms=${REMINDER_POLL_INTERVAL_MS}
app.reminders.rebuild-cron=${REMINDER_REBUILD_CRON}

# Approved Meta template for patient reminders. The template must contain
# two quick-reply buttons: Confirmar / Cancelar.
app.reminders.template.enabled=${REMINDER_TEMPLATE_ENABLED}
app.reminders.template.name=${REMINDER_TEMPLATE_NAME}
app.reminders.template.language=${REMINDER_TEMPLATE_LANGUAGE}
app.reminders.template.clinic-name=${REMINDER_TEMPLATE_CLINIC_NAME}
app.reminders.template.confirm-label=${REMINDER_TEMPLATE_CONFIRM_LABEL}
app.reminders.template.cancel-label=${REMINDER_TEMPLATE_CANCEL_LABEL}