spring.application.name=DentalBot
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically creates/updates database tables based on JPA entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable automatic Docker compose execution (Docker runs inside WSL)
spring.docker.compose.enabled=false

# WhatsApp Cloud API Settings
whatsapp.api.url=https://graph.facebook.com/v21.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.api.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.doctor.phone-number=${DOCTOR_WHATSAPP_PHONE}
# Dev switch: true = doctor's number also behaves as a patient (greeting goes to patient flow)
whatsapp.doctor.patient-mode=false

# WhatsApp Flows (IDs returned when the Flow JSON is published in WhatsApp Manager)
whatsapp.flows.patient-registration=${WHATSAPP_FLOW_PATIENT_REGISTRATION:}
whatsapp.flows.update-appointment=${WHATSAPP_FLOW_UPDATE_APPOINTMENT:}
whatsapp.flows.search-patient=${WHATSAPP_FLOW_SEARCH_PATIENT:}