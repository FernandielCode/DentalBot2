spring.application.name=DentalBot
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically creates/updates database tables based on JPA entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable automatic Docker compose execution (Docker runs inside WSL)
spring.docker.compose.enabled=false

# WhatsApp Cloud API Settings
whatsapp.api-url=https://graph.facebook.com/v21.0
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.doctor.phone-number=${DOCTOR_WHATSAPP_PHONE}

# Meta App Secret used to validate X-Hub-Signature-256 on incoming POSTs.
whatsapp.app-secret=${WHATSAPP_APP_SECRET}

# Fail closed by default. Set to false only for local development without a Meta app secret.
whatsapp.signature-verification-enabled=${WHATSAPP_SIGNATURE_VERIFICATION_ENABLED}