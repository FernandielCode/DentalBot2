spring.application.name=DentalBot

# In Render, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD will be used.
# Locally on your machine, it will automatically fall back to your local WSL Postgres on 5433!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/Dentalbot_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gabriel27}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically creates/updates database tables based on JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable automatic Docker compose execution (Docker runs inside WSL)
spring.docker.compose.enabled=false

# WhatsApp Cloud API Settings
whatsapp.api.url=https://graph.facebook.com/v21.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.api.verify-token=${WHATSAPP_VERIFY_TOKEN:DentalClinicSecretToken2026}
whatsapp.doctor.phone-number=${DOCTOR_WHATSAPP_PHONE:}